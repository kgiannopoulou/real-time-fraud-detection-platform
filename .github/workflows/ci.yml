name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  MLFLOW_DISABLE_AGENT_HINT: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.17.1
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Grafana dashboards are generated from code
        run: |
          python monitoring/grafana/build_dashboards.py
          git diff --exit-code monitoring/grafana/dashboards
      - name: Compose file is valid
        run: docker compose config --quiet

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infrastructure
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.0
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  unit-tests:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Unit tests
        run: pytest -m "not integration and not spark" --cov --cov-report=term --cov-report=xml
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  integration-tests:
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Start Kafka and PostgreSQL
        run: |
          docker compose up -d --wait kafka postgres
          docker compose up kafka-init
      - name: Integration tests
        run: pytest -m integration
      - name: Service logs on failure
        if: failure()
        run: docker compose logs --tail 200

  spark-tests:
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"   # same as the Spark image
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install the Spark image's Python environment
        run: pip install -r requirements-streaming.txt pyspark==4.0.1 pytest scikit-learn lightgbm confluent-kafka
      - name: Spark streaming tests
        run: pytest -m spark

  docker-build:
    needs: [integration-tests, spark-tests]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - {name: spark, dockerfile: streaming/Dockerfile}
          - {name: api, dockerfile: api/Dockerfile}
          - {name: dashboard, dockerfile: dashboard/Dockerfile}
          - {name: producer, dockerfile: producer/Dockerfile}
          - {name: airflow, dockerfile: airflow/Dockerfile}
          - {name: mlflow, dockerfile: infrastructure/mlflow/Dockerfile}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          tags: fraud-platform/${{ matrix.image.name }}:ci
          push: false
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}

  end-to-end:
    needs: docker-build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt
      - name: Start the full platform
        run: docker compose up -d --build
      - name: Smoke test (health, Kafka -> Spark -> PostgreSQL -> API, dead-letter queue)
        run: python scripts/smoke_test.py
      - name: Service logs on failure
        if: failure()
        run: docker compose logs --tail 150
