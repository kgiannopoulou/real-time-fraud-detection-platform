[project]
name = "real-time-fraud-detection-platform"
version = "0.1.0"
description = "Production-style streaming platform for real-time card fraud detection"
requires-python = ">=3.10"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
