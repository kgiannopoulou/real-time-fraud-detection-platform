# Local platform. Services are added phase by phase; see README "Roadmap".
name: fraud-platform

x-kafka-image: &kafka-image apache/kafka:3.9.1

services:
  # Single-node Kafka in KRaft mode (no ZooKeeper). Two listeners: containers
  # use kafka:9092, the host uses localhost:9094.
  kafka:
    image: *kafka-image
    hostname: kafka
    ports:
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 24
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  # Creates the topics once Kafka is healthy (idempotent).
  kafka-init:
    image: *kafka-image
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./infrastructure/kafka/create-topics.sh:/create-topics.sh:ro
    entrypoint: ["/bin/bash", "/create-topics.sh"]
    environment:
      BOOTSTRAP: kafka:9092
    restart: "no"

  # Serving store: recent transactions, predictions, alerts, model metadata.
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fraud
      POSTGRES_USER: fraud
      POSTGRES_PASSWORD: fraud
    ports:
      - "5436:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraud -d fraud"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Spark Structured Streaming job (local[*] master inside one container).
  spark:
    build:
      context: .
      dockerfile: streaming/Dockerfile
    image: fraud-platform/spark:latest
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      mlflow:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      POSTGRES_DSN: postgresql://fraud:fraud@postgres:5432/fraud
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MODEL_ALIAS: champion
      MODEL_REFRESH_SECONDS: 60
      STARTING_OFFSETS: latest
      LAKE_PATH: /data/lake
      CHECKPOINT_ROOT: /data/checkpoints
    ports:
      - "4040:4040"   # Spark UI
    volumes:
      - ./data/lake:/data/lake
      - spark-checkpoints:/data/checkpoints
      - ./ml/artifacts:/app/ml/artifacts:ro   # fallback model when the registry is unreachable
    restart: unless-stopped

  # Online scoring + read API over the serving store.
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    image: fraud-platform/api:latest
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    environment:
      POSTGRES_DSN: postgresql://fraud:fraud@postgres:5432/fraud
      MLFLOW_TRACKING_URI: http://mlflow:5000
    ports:
      - "8000:8000"
    volumes:
      - ./ml/artifacts:/app/ml/artifacts:ro   # fallback model
    restart: unless-stopped

  # Experiment tracking + model registry. SQLite metadata and artefacts live
  # in a named volume; artefacts are proxied through the server (--serve-artifacts)
  # so clients only need the tracking URI.
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.17.1
    command: >
      mlflow server
      --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts
      --serve-artifacts
      --allowed-hosts localhost,localhost:5000,127.0.0.1,127.0.0.1:5000,mlflow,mlflow:5000
    ports:
      - "5000:5000"
    volumes:
      - mlflow-data:/mlflow
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  kafka-data:
  postgres-data:
  spark-checkpoints:
  mlflow-data:
