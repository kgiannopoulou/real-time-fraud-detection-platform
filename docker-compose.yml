# Local platform:  docker compose up -d --build
#
#   Kafka (KRaft) ─► Spark Structured Streaming ─► PostgreSQL ─► API / Dashboard
#   MLflow (tracking + registry) · Airflow (retraining) · Prometheus + Grafana
#
# Start streaming test traffic with either
#   python producer/producer.py --rate 30            (from the host), or
#   docker compose --profile demo up -d producer     (inside the stack).
name: fraud-platform

x-kafka-image: &kafka-image apache/kafka:3.9.1

services:
  # Single-node Kafka in KRaft mode (no ZooKeeper). Two listeners: containers
  # use kafka:9092, the host uses localhost:9094.
  kafka:
    image: *kafka-image
    hostname: kafka
    ports:
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  # Creates the topics once Kafka is healthy (idempotent).
  kafka-init:
    image: *kafka-image
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./infrastructure/kafka/create-topics.sh:/create-topics.sh:ro
    entrypoint: ["/bin/bash", "/create-topics.sh"]
    environment:
      BOOTSTRAP: kafka:9092
    restart: "no"

  # Serving store: recent transactions, predictions, alerts, model metadata.
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fraud
      POSTGRES_USER: fraud
      POSTGRES_PASSWORD: fraud_local_pw
    ports:
      - "5436:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./storage/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraud -d fraud"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Spark Structured Streaming job (local[*] master inside one container).
  spark:
    build:
      context: .
      dockerfile: streaming/Dockerfile
    image: fraud-platform/spark:latest
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      mlflow:
        condition: service_healthy
      postgres:
        condition: service_healthy
      model-bootstrap:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      POSTGRES_DSN: postgresql://fraud:fraud_local_pw@postgres:5432/fraud
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MODEL_ALIAS: champion
      MODEL_REFRESH_SECONDS: 60
      STARTING_OFFSETS: latest
      LAKE_PATH: /data/lake
      CHECKPOINT_ROOT: /data/checkpoints
    ports:
      - "4040:4040"   # Spark UI (+ JVM metrics at /metrics/prometheus)
      - "9108:9108"   # application metrics
    volumes:
      # Lake and checkpoints share one volume so they can never get out of sync.
      - spark-data:/data
      - ./ml/artifacts:/app/ml/artifacts:ro   # fallback model when the registry is unreachable
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9108/metrics"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    restart: unless-stopped

  # Online scoring + read API over the serving store.
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    image: fraud-platform/api:latest
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_healthy
      model-bootstrap:
        condition: service_completed_successfully
    environment:
      POSTGRES_DSN: postgresql://fraud:fraud_local_pw@postgres:5432/fraud
      MLFLOW_TRACKING_URI: http://mlflow:5000
    ports:
      - "8000:8000"
    volumes:
      - ./ml/artifacts:/app/ml/artifacts:ro   # fallback model
    restart: unless-stopped

  # Real-time fraud monitor (Streamlit).
  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    image: fraud-platform/dashboard:latest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_DSN: postgresql://fraud:fraud_local_pw@postgres:5432/fraud
    ports:
      - "8501:8501"
    restart: unless-stopped

  # Batch orchestration: weekly retraining DAG (scheduler + webserver).
  airflow:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    image: fraud-platform/airflow:latest
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_healthy
      model-bootstrap:
        condition: service_completed_successfully
    environment:
      AIRFLOW_ADMIN_DSN: postgresql://fraud:fraud_local_pw@postgres:5432/fraud
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://fraud:fraud_local_pw@postgres:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      AIRFLOW__WEBSERVER__WORKERS: 2
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "false"
      # Shared by all webserver workers (sessions + CSRF); local-only value.
      AIRFLOW__WEBSERVER__SECRET_KEY: local-dev-airflow-secret
      MLFLOW_TRACKING_URI: http://mlflow:5000
      POSTGRES_DSN: postgresql://fraud:fraud_local_pw@postgres:5432/fraud
      MLFLOW_DISABLE_AGENT_HINT: 1
    ports:
      - "8080:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags:ro
      - ml-data:/opt/fraud/data
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/health"]
      interval: 15s
      timeout: 10s
      retries: 20
    restart: unless-stopped

  # Monitoring: Prometheus (metrics + alert rules) and Grafana (dashboards).
  prometheus:
    image: prom/prometheus:v3.6.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.2.0
    depends_on: [prometheus]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/platform.json
    ports:
      - "3001:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    restart: unless-stopped

  # Topic offsets / partition metrics for Prometheus.
  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.9.0
    command: ["--kafka.server=kafka:9092"]
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  # One-shot: trains + registers a first champion model if the registry is
  # empty (fresh checkout). Reuses the Airflow image's isolated ML virtualenv.
  model-bootstrap:
    image: fraud-platform/airflow:latest
    build:
      context: .
      dockerfile: airflow/Dockerfile
    entrypoint: ["/opt/ml-venv/bin/python", "-m", "ml.bootstrap"]
    working_dir: /opt/fraud
    depends_on:
      mlflow:
        condition: service_healthy
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_DISABLE_AGENT_HINT: 1
    volumes:
      - ml-data:/opt/fraud/data
    restart: "no"

  # Synthetic traffic inside the stack (opt-in: --profile demo).
  producer:
    profiles: [demo]
    build:
      context: .
      dockerfile: producer/Dockerfile
    image: fraud-platform/producer:latest
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      spark:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    command: ["--rate", "${GENERATOR_RATE:-20}", "--quiet", "--metrics-port", "8001",
              "--late-rate", "0.02", "--duplicate-rate", "0.005", "--invalid-rate", "0.005"]
    restart: unless-stopped

  # Experiment tracking + model registry. SQLite metadata and artefacts live
  # in a named volume; artefacts are proxied through the server (--serve-artifacts)
  # so clients only need the tracking URI.
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.17.1
    command: >
      mlflow server
      --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts
      --serve-artifacts
      --allowed-hosts localhost,localhost:5000,127.0.0.1,127.0.0.1:5000,mlflow,mlflow:5000
    ports:
      - "5000:5000"
    volumes:
      - mlflow-data:/mlflow
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  kafka-data:
  postgres-data:
  spark-data:
  ml-data:
  mlflow-data:
  prometheus-data:
  grafana-data:
