# Prometheus configuration for the local platform.
global:
  scrape_interval: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # Spark driver: application metrics (throughput, lag, latency, drift, DLQ).
  - job_name: spark-stream
    static_configs:
      - targets: ["spark:9108"]

  # Spark JVM / executor metrics (PrometheusServlet on the UI port).
  - job_name: spark-jvm
    metrics_path: /metrics/prometheus
    static_configs:
      - targets: ["spark:4040"]

  - job_name: api
    metrics_path: /metrics/
    static_configs:
      - targets: ["api:8000"]

  # Producer: the compose service, or one started on the host with --metrics-port 8001.
  - job_name: producer
    static_configs:
      - targets: ["producer:8001", "host.docker.internal:8001"]

  - job_name: kafka
    static_configs:
      - targets: ["kafka-exporter:9308"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
