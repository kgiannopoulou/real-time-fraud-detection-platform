apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    url: http://prometheus:9090
    isDefault: true
  - name: PostgreSQL
    uid: postgres
    type: grafana-postgresql-datasource
    url: postgres:5432
    user: fraud
    jsonData:
      database: fraud
      sslmode: disable
      postgresVersion: 1600
    secureJsonData:
      password: fraud_local_pw
